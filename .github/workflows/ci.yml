name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy the Docker image to an Akamai Cloud (Linode) server via SSH.
  # Required repository secrets:
  #   DEPLOY_HOST            – IP address or hostname of the Akamai Cloud server
  #   DEPLOY_USER            – SSH username on the server (e.g. "deploy")
  #   DEPLOY_SSH_PRIVATE_KEY – private SSH key whose public half is in the
  #                            server's ~/.ssh/authorized_keys
  #   DEPLOY_SSH_PASSPHRASE  - passphrase for the private SSH key
  deploy-server:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Compute image reference
        run: |
          # Lowercase for Docker compatibility
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Deploy to Akamai Cloud
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          script: |
            # Log in to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull the exact image built for this commit
            docker pull ${{ env.IMAGE }}

            # Replace the running container
            docker stop whist 2>/dev/null || true
            docker rm whist 2>/dev/null || true
            docker run -d \
              --name whist \
              --restart unless-stopped \
              --network server_config_default \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.whist.rule=Host(\`${{ secrets.DEPLOY_HOST }}\`) && PathPrefix(\`/whist\`)" \
              --label "traefik.http.routers.whist.entrypoints=websecure" \
              --label "traefik.http.services.whist.loadbalancer.server.port=8080" \
              --label "traefik.http.routers.whist.tls=true" \
              --label "traefik.http.routers.whist.tls.options=default" \
              --label "traefik.http.routers.whist.tls.certresolver=dnsresolver" \
              --label "traefik.http.routers.whist.middlewares=security-headers" \
              ${{ env.IMAGE }}

            # Clean up old images
            docker image prune -f
