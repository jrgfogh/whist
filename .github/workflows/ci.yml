name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-client:
    runs-on: ubuntu-latest
    container:
      image: node:26
    permissions:
      contents: read

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Upload client assets
        uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: client/dist

      - name: Test client
        run: npm test -- --coverage

      - name: Upload JS coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: client/coverage/lcov.info
          flag-name: javascript
          parallel: true
          coveralls-token: ${{ secrets.COVERALLS_REPO_TOKEN }}

  build-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --blame-hang-timeout 1m --collect:"XPlat Code Coverage"

      - name: Upload .NET coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: '**/coverage.cobertura.xml'
          format: cobertura
          flag-name: dotnet
          parallel: true
          coveralls-token: ${{ secrets.COVERALLS_REPO_TOKEN }}

  coveralls-finish:
    needs:
      - build-client
      - build-server
    runs-on: ubuntu-latest
    steps:
      - name: Finalize Coveralls parallel build
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          coveralls-token: ${{ secrets.COVERALLS_REPO_TOKEN }}

  build-container:
    runs-on: ubuntu-latest
    needs:
      - build-client
      - build-server
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Download client assets
        uses: actions/download-artifact@v8
        with:
          name: client-dist
          path: Whist.Server/wwwroot

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container archive
        if: github.event_name != 'push'
        run: >
          dotnet publish Whist.Server/Whist.Server.csproj
          -c Release
          /t:PublishContainer
          -p:ContainerArchiveOutputPath=${{ runner.temp }}/whist-image.tar.gz
          -p:ContainerImageTags=${{ github.sha }}

      - name: Publish images to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          dotnet publish Whist.Server/Whist.Server.csproj \
            -c Release \
            /t:PublishContainer \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerImageTags=${{ github.sha }}

          dotnet publish Whist.Server/Whist.Server.csproj \
            -c Release \
            /t:PublishContainer \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerImageTags=latest

  # Deploy the Docker image to an Akamai Cloud (Linode) server via SSH.
  # Required repository secrets:
  #   DEPLOY_HOST            – IP address or hostname of the Akamai Cloud server
  #   DEPLOY_USER            – SSH username on the server (e.g. "deploy")
  #   DEPLOY_SSH_PRIVATE_KEY – private SSH key whose public half is in the
  #                            server's ~/.ssh/authorized_keys
  #   DEPLOY_SSH_PASSPHRASE  - passphrase for the private SSH key
  deploy-server:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: build-container
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Compute image reference
        run: |
          # Lowercase for Docker compatibility
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Deploy to Akamai Cloud
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          script: |
            # Log in to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull the exact image built for this commit
            docker pull ${{ env.IMAGE }}

            # Replace the running container
            docker stop whist 2>/dev/null || true
            docker rm whist 2>/dev/null || true
            docker run -d \
              --name whist \
              --restart unless-stopped \
              --network server_config_default \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.whist.rule=Host(\`${{ secrets.DEPLOY_HOST }}\`) && PathPrefix(\`/whist\`)" \
              --label "traefik.http.routers.whist.entrypoints=websecure" \
              --label "traefik.http.services.whist.loadbalancer.server.port=8080" \
              --label "traefik.http.routers.whist.tls=true" \
              --label "traefik.http.routers.whist.tls.options=default" \
              --label "traefik.http.routers.whist.tls.certresolver=dnsresolver" \
              --label "traefik.http.routers.whist.middlewares=security-headers" \
              ${{ env.IMAGE }}

            # Clean up old images
            docker image prune -f
