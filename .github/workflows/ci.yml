name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, test and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          target: export
          outputs: type=local,dest=${{ runner.temp }}/publish
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bundle as .zip
        run: cd "$RUNNER_TEMP/publish" && zip -r "$RUNNER_TEMP/whist.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: drop
          path: ${{ runner.temp }}/whist.zip
